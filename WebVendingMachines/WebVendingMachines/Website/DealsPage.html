<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Договоры</title>
    <link href="StyleSheet.css" rel="stylesheet" />
</head>
<body>
    <div class="head head_text">
        <a href="MainPage.html"><h3>Главная</h3></a>
        <a href="VendingMachinesPage.html"><h3>Торговые автоматы</h3></a>
        <a href="DealsPage.html"><h3>Договоры</h3></a>
        <a><h3>Настройки</h3></a>
    </div>

    <div class="MainBlock">
		<div class="VM_Block Padding5 TextAlign">
			<h2 id="TBName">Договоры</h2>
			<div id="DealsBlcok">
				<p>Для просмотра договоров необходимо авторизоваться</p>
			</div>
		</div>
    </div>

    <script>
        async function Init() {
            var user = sessionStorage.getItem("User_fullName")
            if (user != "") {
                const response = await fetch("https://localhost:44396/api/Deals", {
                    method: "GET",
                    headers: {'Access':'application/json'}
                })
                if (response.ok) {
                    var Block = document.getElementById("DealsBlcok")
                    var data = await response.json()
                    while (Block.firstChild) Block.firstChild.remove()

                    for (var i = 0; i < data.length; i++) {
                        var item = data[i]

                        var Deal = document.createElement("div")
                        Deal.className = ""
                        Block.appendChild(Deal)

                        var id = document.createElement("p")
                        id.textContent = item.id
                        Deal.appendChild(id)

                        var date_create = document.createElement("p")
                        var date = new Date(item.date)
                        date_create.textContent = AddZero(date.getDate()) + "." + AddZero((date.getMonth() + 1)) + "." + date.getFullYear()
                        Deal.appendChild(date_create)

                        var end_date = document.createElement("p")
                        date = new Date(item.end_date)
                        end_date.textContent = AddZero(date.getDate()) + "." + AddZero((date.getMonth() + 1)) + "." + date.getFullYear()
                        Deal.appendChild(end_date)

                        var is_accept = document.createElement("p")
                        if (item.is_accept == "True")
                            is_accept.textContent = "Подписано"
                        else
                            is_accept.textContent = "Не подписано"
                        Deal.appendChild(is_accept)
                    }
                }
            }
        }
        function AddZero(number) {
            if (number < 10)
                return "0" + number
            else
                return number
        }

        Init()
    </script>
</body>
</html>
