<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Главная</title>
    <link href="StyleSheet.css" rel="stylesheet"/>
</head>
<body>
    <div class="head head_text">
        <a href="MainPage.html"><h3>Главная</h3></a>
        <a href="VendingMachinesPage.html"><h3>Торговые автоматы</h3></a>
        <a><h3>Договоры</h3></a>
        <a><h3>Настройки</h3></a>
    </div>

    <div class="MainBlock">
		<div class="VM_Block Padding5 TextAlign">
			<h2 id="TBName">Авторизация</h2>
			<div id="AuthorizationDiv">
			</div>
			<button id="btnAuthorization" onclick="Authorization()" class="Margin10 Padding5">Войти</button>
		</div>
    </div>
    <script>
        async function Captcha() {
            var Captcha = sessionStorage.getItem("Captcha")
            if (Captcha != "Success") {
                window.open("https://localhost:44396/Website/CaptchaPage.html", "_self")
            }
        }
		async function Authorization() {
            var Name = document.getElementById("TBName")

            if (Name.textContent == "Авторизация") {
                const response = await fetch("https://localhost:44396/api/Users", {
                    method: "GET",
                    headers: { 'Access': 'application/json' }
                })
                if (response.ok) {
                    var data = await response.json()
                    var email = document.getElementById("IEmail").value
                    var password = document.getElementById("IPassword").value


                    for (var i = 0; i < data.length; i++) {
                        var item = data[i]
                        if (email == item.email && password == item.password) {
                            Name.textContent = "Добро пожаловать " + item.full_name
							sessionStorage.setItem("User_fullName", item.full_name)
							btnAuthorization.textContent = "Выйти"
                            ClearAuthorizationBlock()
                        }
                    }
                }
            }
            else {
                sessionStorage.setItem("User_fullName", "")
                btnAuthorization.textContent = "Войти"
                Name.textContent = "Авторизация"
                Init()
            }
        }
        async function Init() {
            if (sessionStorage.getItem("User_fullName")) {
				document.getElementById("TBName").textContent = "Добро пожаловать " + sessionStorage.getItem("User_fullName")
				btnAuthorization.textContent = "Выйти"
            }
            else {
                var Block = document.getElementById("AuthorizationDiv");

                var PEmail = document.createElement("p")
                PEmail.textContent = "Email"
                Block.appendChild(PEmail)

                var email = document.createElement("input")
                email.id = "IEmail"
                Block.appendChild(email)

                var PPassword = document.createElement("p")
                PPassword.textContent = "Пароль"
                Block.appendChild(PPassword)

                var password = document.createElement("input")
                password.id = "IPassword"
                password.type = "password"
                Block.appendChild(password)
            }
        }
        async function ClearAuthorizationBlock() {
            var Block = document.getElementById("AuthorizationDiv")
            while (Block.firstChild) Block.firstChild.remove()
        }

        Init()
        Captcha()
    </script>
</body>
</html>
