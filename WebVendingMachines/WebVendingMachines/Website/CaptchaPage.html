<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Каптча</title>
    <link href="StyleSheet.css" rel="stylesheet"/>
</head>
<body class="Flex" style="justify-content:center; min-height:500px; align-items:center">
	<fieldset class="Margin10">
		<h1 align="center">Каптча</h1>
		<p id="TextCaptcha" align="center" style="font-size:20px">Nothing</p>
		<input type="number" id="IAnswer" />
		<p align="center">
			<button onclick="Check()">Проверить</button>
			<button onclick="Captcha()">
				<img src="../Resources/icons/black/repeat.svg" width="7" />
				Обновить
			</button>
		</p>
	</fieldset>

	<dialog id="dialog">
		<p></p>
		<button class="Padding5" onclick="CloseDialog()"></button>
	</dialog>

	<script>
		async function Captcha() {
			var TextPlace = document.getElementById("TextCaptcha")
			var yes = document.getElementById("asnswer")
			var operations = "/*-+"
			var skob = await getRandom(0, 2)

			number1 = await getRandom(1, 20)
			number2 = await getRandom(1, 20)
			number3 = await getRandom(1, 20)
			number4 = await getRandom(1, 20)
			operation1 = operations[await getRandom(0, 4)]
			operation2 = operations[await getRandom(0, 4)]

			if (skob) {
				var fun = "(" + number1 + operation1 + number2 + ") * " + number3 + operation2 + number4
				var answer = await Operate(await Operate(await Operate(number1, operation1, number2), "*", number3), operation2, number4)
			}
			else {
				var fun = number1 + operation1 + "(" + number2 + operation2 + number3 + ") * " + number4
				var answer = await Operate(number1, operation1, await Operate(await Operate(number2, operation2, number3), "*", number4))
			}

			TextPlace.textContent = fun
			sessionStorage.setItem("CaptchaAnswer", answer)
		}
		async function Operate(number1, operation, number2) {
			switch (operation) {
				case "-":
					return number1 - number2
					break
				case "+":
					return number1 + number2
					break
				case "*":
					return number1 * number2
					break
				default:
					return number1 / number2
					break
			}
		}
		async function Check() {
			var dialog = document.getElementById("dialog")
			dialog.showModal()
			if (sessionStorage.getItem("CaptchaAnswer") == document.getElementById("IAnswer").value) {
				dialog.className = "BorderGreen"
				dialog.firstElementChild.textContent = "Каптча решена правильно"
				dialog.lastElementChild.textContent = "Продолжить"
				sessionStorage.setItem("Captcha", "Success")
			}
			else {
				dialog.className = "BorderRed"
				dialog.lastElementChild.textContent = "Закрыть"
				dialog.firstElementChild.textContent = "Каптча решена неправильно, попробуйте еще раз"
			}
		}
		async function getRandom(min, max) {
			return Math.floor(Math.random() * (max - min)) + min
		}
		async function CloseDialog() {
			var dialog = document.getElementById("dialog")
			if (sessionStorage.getItem("CaptchaAnswer") == document.getElementById("IAnswer").value) {
				window.open("https://localhost:44396/Website/MainPage.html", "_self")
			}
			else {
				dialog.close()
			}
		}

		Captcha()
	</script>
</body>
</html>
